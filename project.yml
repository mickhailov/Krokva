name: Krokva
options:
  bundleIdPrefix: ca.krokva
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.2"
targets:
  Krokva:
    type: application
    platform: iOS
    sources:
      - Krokva
    resources:
      - Krokva/Resources
    info:
      path: Krokva/Resources/Info.plist
      properties:
        CFBundleDisplayName: Krokva
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: Navy
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Krokva uses location only when you choose to search near you.
        ERstatAPIKey: "$(esk_uL6OxzJHOAQzmR8q1SxaCtLG6wnGCo4HeEH9agp3)"
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.krokva.app
        ERSTAT_API_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_USER_SCRIPT_SANDBOXING: true
